name: bonsai-local
services:
  inference:
    image: bonsai-local-prism:prism-b10709-9a9394a
    build: .
    gpus: all
    restart: "no"
    ports:
      - "127.0.0.1:8003:8080"
    volumes:
      - ./models:/models:ro
    environment:
      LD_LIBRARY_PATH: /runtime:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu
    entrypoint: ["/runtime/llama-server"]
    command:
      - --model
      - /models/Ternary-Bonsai-2-27B-PTQ1_0.gguf
      - --lora-scaled
      - /models/bonsai2-27b-uncensored-own42-lora.gguf:1.5
      - --alias
      - bonsai-2-27b-uncensored
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "32768"
      - --parallel
      - "1"
      - --threads
      - "8"
      - --n-gpu-layers
      - "99"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --batch-size
      - "512"
      - --ubatch-size
      - "128"
      - --jinja
      - --chat-template-kwargs
      - '{"enable_thinking": false}'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
